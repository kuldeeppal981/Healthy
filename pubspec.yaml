name: healthy_app
description: Calorie tracker with barcode scan, allergy alerts and a gym workout planner.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  google_fonts: ^6.2.1
  mobile_scanner: ^5.2.3
  http: ^1.2.2
  shared_preferences: ^2.3.2
  supabase_flutter: ^2.8.0
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  pedometer: ^4.0.2
  permission_handler: ^11.3.1
  home_widget: ^0.6.0
  image_picker: ^1.1.2
  speech_to_text: ^7.0.0
  health: ^11.1.0
  share_plus: ^10.1.4
  pdf: ^3.11.1
  printing: ^5.13.4
  path_provider: ^2.1.5
  google_mlkit_text_recognition: ^0.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
