name: Build Android APK

# Runs ONLY when started by hand from the Actions tab
# (Actions -> Build Android APK -> Run workflow). Not on push.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The repo only holds lib/ and pubspec.yaml, so create the Android
      # project here. Existing files (lib/, pubspec.yaml) are kept.
      - name: Generate Android project
        run: |
          flutter create --platforms=android --project-name healthy_app --org com.kuldeep .
          rm -f test/widget_test.dart

      - name: Add camera and internet permissions
        run: |
          python3 - <<'EOF'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perms = (
              '\n    <uses-permission android:name="android.permission.INTERNET"/>'
              '\n    <uses-permission android:name="android.permission.CAMERA"/>'
              '\n    <uses-permission android:name="android.permission.health.READ_STEPS"/>'
              '\n    <uses-permission android:name="android.permission.health.READ_HEART_RATE"/>'
              '\n    <uses-permission android:name="android.permission.health.READ_SLEEP"/>'
              '\n    <uses-permission android:name="android.permission.health.READ_EXERCISE"/>'
              '\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>'
              '\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>'
              '\n    <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT"/>'
              '\n    <uses-permission android:name="android.permission.VIBRATE"/>'
              '\n    <queries><intent><action android:name="android.speech.RecognitionService"/></intent><intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent><package android:name="com.google.android.apps.healthdata"/></queries>'
              '\n    <uses-permission android:name="android.permission.ACTIVITY_RECOGNITION"/>'
              '\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>'
              '\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>'
          )
          if 'android.permission.CAMERA' not in s:
              s = re.sub(r'(<manifest[^>]*>)', r'\1' + perms, s, count=1)
          # Receivers that keep scheduled reminders alive and restore them after a reboot.
          if 'ScheduledNotificationReceiver' not in s:
              recv = (
                  '\n        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver"/>'
                  '\n        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">'
                  '\n            <intent-filter>'
                  '\n                <action android:name="android.intent.action.BOOT_COMPLETED"/>'
                  '\n                <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>'
                  '\n            </intent-filter>'
                  '\n        </receiver>'
                  '\n        <activity-alias android:name="ViewPermissionUsageActivity" android:exported="true" android:targetActivity=".MainActivity" android:permission="android.permission.START_VIEW_PERMISSION_USAGE">'
                  '\n            <intent-filter>'
                  '\n                <action android:name="android.intent.action.VIEW_PERMISSION_USAGE"/>'
                  '\n                <category android:name="android.intent.category.HEALTH_PERMISSIONS"/>'
                  '\n            </intent-filter>'
                  '\n        </activity-alias>'
              )
              s = s.replace('</application>', recv + '\n    </application>', 1)
          # Home screen widget.
          if 'HealthyWidgetProvider' not in s:
              widget = (
                  '\n        <receiver android:name=".HealthyWidgetProvider" android:exported="true">'
                  '\n            <intent-filter>'
                  '\n                <action android:name="android.appwidget.action.APPWIDGET_UPDATE"/>'
                  '\n            </intent-filter>'
                  '\n            <meta-data android:name="android.appwidget.provider" android:resource="@xml/healthy_widget_info"/>'
                  '\n        </receiver>'
              )
              s = s.replace('</application>', widget + '\n    </application>', 1)
          # Deep link so Google sign-in can return to the app.
          if 'login-callback' not in s:
              link = (
                  '\n            <meta-data android:name="flutter_deeplinking_enabled" android:value="false"/>'
                  '\n            <intent-filter>'
                  '\n                <action android:name="androidx.health.ACTION_SHOW_PERMISSIONS_RATIONALE"/>'
                  '\n            </intent-filter>'
                  '\n            <intent-filter>'
                  '\n                <action android:name="android.intent.action.VIEW"/>'
                  '\n                <category android:name="android.intent.category.DEFAULT"/>'
                  '\n                <category android:name="android.intent.category.BROWSABLE"/>'
                  '\n                <data android:scheme="io.supabase.healthy" android:host="login-callback"/>'
                  '\n            </intent-filter>'
              )
              s = s.replace('</activity>', link + '\n        </activity>', 1)
          open(p, 'w', encoding='utf-8').write(s)
          EOF

      - name: Add home screen widget files
        run: |
          set -e
          main=android/app/src/main
          mkdir -p $main/kotlin/com/kuldeep/healthy_app $main/res/layout $main/res/xml $main/res/drawable
          cat > $main/kotlin/com/kuldeep/healthy_app/HealthyWidgetProvider.kt <<'EOF'
          package com.kuldeep.healthy_app

          import android.appwidget.AppWidgetManager
          import android.content.Context
          import android.content.SharedPreferences
          import android.widget.RemoteViews
          import es.antonborri.home_widget.HomeWidgetLaunchIntent
          import es.antonborri.home_widget.HomeWidgetProvider

          class HealthyWidgetProvider : HomeWidgetProvider() {
              override fun onUpdate(
                  context: Context,
                  appWidgetManager: AppWidgetManager,
                  appWidgetIds: IntArray,
                  widgetData: SharedPreferences
              ) {
                  appWidgetIds.forEach { id ->
                      val views = RemoteViews(context.packageName, R.layout.healthy_widget).apply {
                          setTextViewText(R.id.w_kcal, widgetData.getString("w_kcal", "Open Healthy"))
                          setTextViewText(R.id.w_protein, widgetData.getString("w_protein", ""))
                          setTextViewText(R.id.w_steps, widgetData.getString("w_steps", ""))
                          setTextViewText(R.id.w_streak, widgetData.getString("w_streak", ""))
                          setOnClickPendingIntent(
                              R.id.w_root,
                              HomeWidgetLaunchIntent.getActivity(context, MainActivity::class.java)
                          )
                      }
                      appWidgetManager.updateAppWidget(id, views)
                  }
              }
          }
          EOF
          cat > $main/res/layout/healthy_widget.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/w_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="14dp"
              android:background="@drawable/widget_bg">
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Today"
                  android:textColor="#D9CCFF"
                  android:textSize="12sp" />
              <TextView
                  android:id="@+id/w_kcal"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:textColor="#FFFFFF"
                  android:textSize="22sp"
                  android:textStyle="bold" />
              <TextView
                  android:id="@+id/w_protein"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:textColor="#FFFFFF"
                  android:textSize="13sp" />
              <TextView
                  android:id="@+id/w_steps"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:textColor="#FFFFFF"
                  android:textSize="13sp" />
              <TextView
                  android:id="@+id/w_streak"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="4dp"
                  android:textColor="#FFD9CC"
                  android:textSize="12sp" />
          </LinearLayout>
          EOF
          cat > $main/res/drawable/widget_bg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#6C3CE9" />
              <corners android:radius="20dp" />
          </shape>
          EOF
          cat > $main/res/xml/healthy_widget_info.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="180dp"
              android:minHeight="110dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/healthy_widget"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          EOF

      - name: Use FlutterFragmentActivity (needed for Health Connect permissions)
        run: |
          f=$(find android/app/src/main -name MainActivity.kt | head -1)
          sed -i 's/io.flutter.embedding.android.FlutterActivity/io.flutter.embedding.android.FlutterFragmentActivity/; s/FlutterActivity()/FlutterFragmentActivity()/' "$f"
          cat "$f"

      - name: Set minSdk to 26 (needed by Health Connect)
        run: |
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] && sed -i -E 's/minSdk(Version)?[ =]+flutter\.minSdkVersion/minSdk = 26/' "$f" || true
          done
          grep -n "minSdk" android/app/build.gradle* || true

      - name: Enable core library desugaring (needed by notifications)
        run: |
          python3 - <<'EOF'
          import os, re
          kts = 'android/app/build.gradle.kts'
          groovy = 'android/app/build.gradle'
          if os.path.exists(kts):
              p = kts; s = open(p).read()
              if 'isCoreLibraryDesugaringEnabled' not in s:
                  s = s.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
                  s += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
                  open(p, 'w').write(s)
          elif os.path.exists(groovy):
              p = groovy; s = open(p).read()
              if 'coreLibraryDesugaringEnabled' not in s:
                  s = s.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true', 1)
                  s += "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"
                  open(p, 'w').write(s)
          EOF
          grep -n -i "desugar" android/app/build.gradle* || true

      - name: Keep R8 from failing on optional ML Kit classes
        run: |
          python3 - <<'EOF'
          import os
          rules = 'android/app/proguard-rules.pro'
          open(rules, 'w').write('-dontwarn com.google.mlkit.vision.text.**\n-dontwarn com.google.android.gms.internal.mlkit_vision_text_**\n')
          kts = 'android/app/build.gradle.kts'
          groovy = 'android/app/build.gradle'
          if os.path.exists(kts):
              s = open(kts).read()
              if 'proguard-rules.pro' not in s:
                  s = s.replace('release {', 'release {\n            isMinifyEnabled = false\n            isShrinkResources = false\n            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")', 1)
                  open(kts, 'w').write(s)
          elif os.path.exists(groovy):
              s = open(groovy).read()
              if 'proguard-rules.pro' not in s:
                  s = s.replace('release {', "release {\n            minifyEnabled false\n            shrinkResources false\n            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'", 1)
                  open(groovy, 'w').write(s)
          EOF
          grep -n -A8 "release {" android/app/build.gradle* || true

      - name: Add app icon and notification icon
        run: |
          set -e
          main=android/app/src/main
          mkdir -p $main/res/drawable $main/res/mipmap-anydpi-v26
          cat > $main/res/drawable/ic_notification.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF"
                  android:pathData="M12,21.35l-1.45,-1.32C5.4,15.36 2,12.28 2,8.5 2,5.42 4.42,3 7.5,3c1.74,0 3.41,0.81 4.5,2.09C13.09,3.81 14.76,3 16.5,3 19.58,3 22,5.42 22,8.5c0,3.78 -3.4,6.86 -8.55,11.54L12,21.35z"/>
          </vector>
          EOF
          cat > $main/res/drawable/ic_launcher_fg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <group android:translateX="27.6" android:translateY="27.6" android:scaleX="2.2" android:scaleY="2.2">
                  <path android:fillColor="#FFFFFFFF"
                      android:pathData="M12,21.35l-1.45,-1.32C5.4,15.36 2,12.28 2,8.5 2,5.42 4.42,3 7.5,3c1.74,0 3.41,0.81 4.5,2.09C13.09,3.81 14.76,3 16.5,3 19.58,3 22,5.42 22,8.5c0,3.78 -3.4,6.86 -8.55,11.54L12,21.35z"/>
              </group>
          </vector>
          EOF
          cat > $main/res/drawable/ic_launcher_bg.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <gradient android:startColor="#8B5CF6" android:endColor="#5B2BD8" android:angle="45"/>
          </shape>
          EOF
          cat > $main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_bg"/>
              <foreground android:drawable="@drawable/ic_launcher_fg"/>
          </adaptive-icon>
          EOF

      - name: Install packages
        run: flutter pub get

      # Add SUPABASE_ANON_KEY under repo Settings -> Secrets and variables ->
      # Actions. Without it the app builds fine and keeps data on the phone only.
      - name: Build release APK
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: flutter build apk --release --no-shrink --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: healthy-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
